appId: dev.ezrabuild.lenso
productName: Lenso
copyright: Ezra
directories:
  output: ../build/installer
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: ../build/receiver-dist/lenso-receiver
    to: receiver
  - from: ../web
    to: receiver/web
  - from: ../vendor/unitycapture/bin
    to: vendor
  - from: ../vendor/unitycapture/NOTICE.md
    to: vendor/NOTICE.md
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  artifactName: Lenso-Setup-${version}.${ext}
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: true
  perMachine: true
  allowElevation: true
  include: build/installer.nsh
  deleteAppDataOnUninstall: false
  shortcutName: Lenso
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
